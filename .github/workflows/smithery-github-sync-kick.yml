name: Smithery GitHub Sync Kick

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/smithery-github-sync-kick.yml
      - .github/SMITHERY_SETUP.md

permissions:
  id-token: write
  actions: write
  contents: read

concurrency:
  group: smithery-github-sync-kick
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger through unified credential broker
        id: broker
        continue-on-error: true
        env:
          CREDENTIAL_BROKER_URL: ${{ vars.CREDENTIAL_BROKER_URL }}
          OIDC_AUDIENCE: unified-credential-mcp
        run: |
          set -euo pipefail
          if [[ -z "${CREDENTIAL_BROKER_URL:-}" ]]; then
            echo 'CREDENTIAL_BROKER_URL repository variable is not configured.' >&2
            exit 78
          fi

          separator='?'
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" == *'?'* ]]; then separator='&'; fi
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${OIDC_AUDIENCE}")"
          oidc_token="$(jq -er '.value' <<<"${oidc_response}")"

          curl --fail --silent --show-error \
            --request POST \
            --url "${CREDENTIAL_BROKER_URL}" \
            --header "Authorization: Bearer ${oidc_token}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            | tee /tmp/credential-broker-sync-receipt.json

      - name: Fallback to repository-scoped GitHub token
        id: fallback
        if: steps.broker.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run upstream-core-sync.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f upstream_ref=main

      - name: Verify a new upstream sync run exists
        env:
          GH_TOKEN: ${{ github.token }}
          BROKER_OUTCOME: ${{ steps.broker.outcome }}
          FALLBACK_OUTCOME: ${{ steps.fallback.outcome }}
        run: |
          set -euo pipefail
          echo "Credential broker outcome: ${BROKER_OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub fallback outcome: ${FALLBACK_OUTCOME}" >> "$GITHUB_STEP_SUMMARY"

          found=0
          for attempt in 1 2 3 4 5 6; do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow upstream-core-sync.yml \
              --limit 10 \
              --json databaseId,event,status,conclusion,headSha,createdAt,url \
              | tee /tmp/upstream-sync-runs.json

            count="$(jq 'length' /tmp/upstream-sync-runs.json)"
            if [[ "$count" -ge 1 ]]; then
              found=1
              break
            fi
            sleep 10
          done

          if [[ "$found" -ne 1 ]]; then
            echo 'No upstream-core-sync run was observable after either trigger route.' >&2
            exit 1
          fi

      - name: Upload sanitized trigger receipts
        uses: actions/upload-artifact@v4
        with:
          name: credential-broker-sync-kick-${{ github.run_id }}
          path: |
            /tmp/credential-broker-sync-receipt.json
            /tmp/upstream-sync-runs.json
          if-no-files-found: ignore
          retention-days: 14
